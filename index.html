<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알람시계</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="alarmClockRoot" class="alarm-clock">
    <h1 class="sr-only">알람시계</h1>

    <!-- 3D 시계 입체 외형 및 원통형 배터리함 SVG -->
    <svg class="alarm-clock__frame" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <clipPath id="compartmentClip">
                <polygon points="572,202 714,112 714,278 572,362" />
            </clipPath>
        </defs>

        <!-- 윗면 -->
        <polygon points="18,130 260,45 730,45 556,130" fill="#935f2b" stroke="#102a3a" stroke-width="2.5" />
        <!-- 정면 몸통 -->
        <rect x="18" y="130" width="538" height="260" fill="#9b6731" stroke="#102a3a" stroke-width="2.5" />
        <!-- 우측 옆면 몸통 -->
        <polygon points="556,130 730,45 730,305 556,390" fill="#96622e" stroke="#102a3a" stroke-width="2.5" />

        <!-- 닫혀 있는 배터리함 덮개(배터리 0 아님) -->
        <g id="closedDoorGroup">
            <polygon id="batteryDoorWide" class="alarm-clock__battery-door" points="572,202 714,132 714,292 572,362" fill="#96622e" stroke="#102a3a" stroke-width="2.5">
            </polygon>
            <polygon id="batteryDoorLatch" class="alarm-clock__door-latch" points="582,250 590,246 590,315 582,319" fill="#96622e" stroke="#102a3a" stroke-width="2">
            </polygon>
        </g>

        <!-- 배터리가 방전되어 건전기 교체 필요 -->
        <g id="openDoorGroup" class="alarm-clock__open-compartment" style="display: none;">
            <polygon points="572,202 714,112 714,278 572,362" fill="#050505" stroke="#102a3a" stroke-width="2.5" />

            <g clip-path="url(#compartmentClip)">
                <!-- 위쪽 원통형 파란 건전지 (- 극) -->
                <g transform="translate(558, 224) rotate(-27)">
                    <rect x="0" y="0" width="152" height="58" rx="16" ry="28" fill="#145b7d" stroke="#072230" stroke-width="2.5" />
                    <circle cx="122" cy="29" r="14" fill="#ffffff" />
                    <line x1="115" y1="29" x2="129" y2="29" stroke="#14597d" stroke-width="3.5" stroke-linecap="round" />
                </g>

                <!-- 아래쪽 원통형 파란 건전지 (+ 극) -->
                <g transform="translate(558, 286) rotate(-27)">
                    <rect x="0" y="0" width="152" height="58" rx="16" ry="28" fill="#145b7d" stroke="#072230" stroke-width="2.5" />
                    <circle cx="122" cy="29" r="14" fill="#ffffff" />
                    <line x1="115" y1="29" x2="129" y2="29" stroke="#14597d" stroke-width="3.5" stroke-linecap="round" />
                    <line x1="122" y1="22" x2="122" y2="36" stroke="#14597d" stroke-width="3.5" stroke-linecap="round" />
                </g>
            </g>

            <polygon points="572,202 714,112 714,278 572,362" fill="none" stroke="#102a3a" stroke-width="2.5" />
            <polygon points="714,112 885,195 885,360 714,278" fill="#96622e" stroke="#102a3a" stroke-width="2.5" />
        </g>
    </svg>

    <!-- 전면 조작부 및 디스플레이 -->
    <div class="alarm-clock__front">
        <div class="alarm-clock__top-bar">
            <section class="alarm-clock__controls" aria-label="시계 조작 버튼">
                <button type="button" id="btnSet" class="alarm-clock__btn" aria-label="Set 모드 선택">Set</button>
                <button type="button" id="btnUp" class="alarm-clock__btn" aria-label="숫자 또는 알람 번호 증가">▲</button>
                <button type="button" id="btnDown" class="alarm-clock__btn" aria-label="숫자 또는 알람 번호 감소">▼</button>
                <button type="button" id="btnConfirm" class="alarm-clock__btn" aria-label="확인 및 다음 단위 이동">◯</button>
            </section>

            <section id="statusBox" class="alarm-clock__status" aria-label="배터리 및 알람 상태">
                <div class="alarm-clock__battery">
                    <svg class="alarm-clock__battery-svg" viewBox="0 0 52 26" aria-hidden="true">
                        <rect id="batteryOutline" x="2" y="3" width="42" height="20" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" />
                        <rect id="batteryTip" x="44" y="8" width="5" height="10" rx="1" fill="#ffffff" />
                        <rect id="batteryFillRect" x="6" y="7" width="34" height="12" fill="#ffffff" />
                        <polyline id="batteryBolt" points="25,2 18,13 24,13 20,24" fill="none" stroke="#1c1d1e" stroke-width="2.2" style="display: none;" />
                    </svg>
                    <span id="batteryNum" class="alarm-clock__battery-num">100</span>
                </div>

                <div class="alarm-clock__alarms" aria-label="알람 1~3번 설정 상태">
                    <svg class="alarm-clock__alarm-icon" data-alarm-idx="0" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="13" r="8" />
                        <polyline points="12 9 12 13 15 15" />
                        <line x1="5" y1="3" x2="2" y2="6" />
                        <line x1="19" y1="3" x2="22" y2="6" />
                    </svg>
                    <svg class="alarm-clock__alarm-icon" data-alarm-idx="1" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="13" r="8" />
                        <polyline points="12 9 12 13 15 15" />
                        <line x1="5" y1="3" x2="2" y2="6" />
                        <line x1="19" y1="3" x2="22" y2="6" />
                    </svg>
                    <svg class="alarm-clock__alarm-icon" data-alarm-idx="2" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="13" r="8" />
                        <polyline points="12 9 12 13 15 15" />
                        <line x1="5" y1="3" x2="2" y2="6" />
                        <line x1="19" y1="3" x2="22" y2="6" />
                    </svg>
                </div>
            </section>
        </div>

        <!-- 큰 디스플레이 (시/분/초) -->
        <section id="lcdScreen" class="alarm-clock__screen" aria-label="시계 시간 표시 화면">
            <span id="warnBadge" class="alarm-clock__warn-badge">00:00:00은 설정 불가</span>

            <div class="alarm-clock__digits" aria-hidden="true">
                <div id="pairHour" class="alarm-clock__digit-pair">
                    <svg id="digitH1" class="alarm-clock__digit" viewBox="0 0 60 110"></svg>
                    <svg id="digitH2" class="alarm-clock__digit" viewBox="0 0 60 110"></svg>
                </div>

                <div class="alarm-clock__colon"></div>

                <div id="pairMin" class="alarm-clock__digit-pair">
                    <svg id="digitM1" class="alarm-clock__digit" viewBox="0 0 60 110"></svg>
                    <svg id="digitM2" class="alarm-clock__digit" viewBox="0 0 60 110"></svg>
                </div>

                <div class="alarm-clock__colon"></div>

                <div id="pairSec" class="alarm-clock__digit-pair">
                    <svg id="digitS1" class="alarm-clock__digit" viewBox="0 0 60 110"></svg>
                    <svg id="digitS2" class="alarm-clock__digit" viewBox="0 0 60 110"></svg>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
